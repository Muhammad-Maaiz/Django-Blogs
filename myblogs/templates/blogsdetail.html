{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'blogsdetail.css' %}">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="blog-detail-card p-4">
                <!-- Blog Image Centered -->
                <div class="blog-image-wrapper text-center">
                    <img src="/media/{{ blogs.blog_image }}" alt="{{ blogs.blog_title }}" class="img-fluid blog-image">
                </div>

                <!-- Blog Title (White) -->
                <h2 class="blog-title">{{ blogs.blog_title }}</h2>

                <!-- Author (Bold) -->
                <p class="blog-meta"><strong>Author:</strong> {{ blogs.blog_author }}</p>

                <!-- Publish Date (Bold) -->
                <p class="blog-meta"><strong>Publish Date:</strong> {{ blogs.blog_created_at }}</p>

                <!-- Blog Content -->
                <p class="blog-content">{{ blogs.blog_content }}</p>

                {% if current_user == blogs.blog_author %}
                    <div class="button-group">
                        <a href="{% url 'updateblog' blogs.id %}" class="btn btn-edit">Update</a>
                        <a href="{% url 'deleteblog' blogs.id %}" class="btn btn-delete">Delete</a>
                    </div>
                {% endif %}

                <!-- Back to Home as a Styled Link -->
                <div class="text-center mt-2">
                    <a href="{% url 'home' %}" class="back-to-home">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
