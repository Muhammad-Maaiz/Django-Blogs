{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogify - Home</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header/Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">𝓟𝓻𝓸𝓑𝓵𝓸𝓰𝓰𝓮𝓻𝓼</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon">&#9776;</span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'addblog' %}">Write Blog</a></li>
                    <li class="nav-item"><a class="nav-link logout-btn" href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Blog Posts -->
    <div class="container mt-4">
        <div class="row">
            {% for post in posts %}
            <div class="col-md-4">
                <div class="blog-card">
                    <h3>{{ post.blog_title }}</h3>
                    <p>by {{ post.blog_author }}</p>
                    <p>Post Date: {{ post.blog_created_at }}</p>
                    <a href="/blogsdetail/{{ post.id }}" class="read-more">Read More</a>
                </div>
            </div>
            {% empty %}
            <p class="no-blogs">No Blogs Available</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
