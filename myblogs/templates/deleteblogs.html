{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Blog</title>
    <link rel="stylesheet" href="{% static 'deleteblogs.css' %}">
</head>
<body>
    <div class="delete-container">
        <form method="POST" class="delete-card">
            {% csrf_token %}
            <h1>Delete Blog</h1>
            <p class="blog-title">Are you sure you want to delete this blog?</p>
            <p class="blog-title">{{ blog.blog_title }}</p>

            <div class="btn-container">
                <button type="submit" class="btn-delete">Delete</button>
                <a href="{% url 'blogsdetail' blog.id %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
